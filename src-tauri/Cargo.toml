[package]
name = "gis-toolbox"
version = "0.1.0"
description = "GIS Toolbox — private Windows 11 desktop shell"
authors = ["R2-Repo"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "gis_toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
