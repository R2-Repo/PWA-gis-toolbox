<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIS Toolbox — Map (Dual Screen)</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/map-window.css">
    <link rel="icon" type="image/png" href="icons/favicon.png">
</head>
<body class="map-window-body">
    <header class="map-window-header">
        <span class="map-window-title">GIS-Toolbox.com — Dual Screen Map</span>
        <div class="map-window-header-controls">
            <div class="header-toggle" id="basemap-toggle"></div>
            <div class="header-toggle" id="dimension-toggle" role="group" aria-label="Map dimension">
                <button type="button" class="header-toggle-option active" data-value="2d" title="Flat map" aria-pressed="true">2D</button>
                <button type="button" class="header-toggle-option" data-value="3d" title="Terrain and buildings" aria-pressed="false">3D</button>
            </div>
            <div id="map-print-host"></div>
            <button type="button" class="btn btn-secondary btn-sm" id="btn-exit-dual-screen">Exit Dual Screen</button>
        </div>
    </header>
    <main class="map-window-main">
        <div id="map-container"></div>
    </main>
    <script type="module" src="js/map-window-entry.js"></script>
</body>
</html>
