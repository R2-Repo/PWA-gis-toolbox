name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type promote to confirm
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require confirmation
        if: inputs.confirm != 'promote'
        run: |
          echo "Promotion cancelled. Type exactly 'promote' in the confirmation field."
          exit 1

  promote:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch branches
        run: |
          git fetch origin main staging
          git checkout staging

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Run tests on staging
        run: |
          npm ci
          npm test

      - name: Check if promotion is needed
        id: diff
        run: |
          AHEAD=$(git rev-list --count origin/main..origin/staging)
          echo "ahead_by=$AHEAD" >> "$GITHUB_OUTPUT"
          if [ "$AHEAD" -eq 0 ]; then
            echo "staging has no new commits for main. Nothing to promote."
          else
            echo "staging is $AHEAD commit(s) ahead of main."
          fi

      - name: Merge staging into main
        if: steps.diff.outputs.ahead_by != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge origin/staging --no-edit -m "Promote staging to production (run ${{ github.run_id }})"
          git push origin main

      - name: Sync staging with main
        if: steps.diff.outputs.ahead_by != '0'
        run: |
          git checkout staging
          git merge origin/main --no-edit -m "Sync staging with main after promotion (run ${{ github.run_id }})"
          git push origin staging
