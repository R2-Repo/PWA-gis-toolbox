name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type promote to confirm
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require confirmation
        if: inputs.confirm != 'promote'
        run: |
          echo "Promotion cancelled. Type exactly 'promote' in the confirmation field."
          exit 1

  promote:
    needs: validate
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Run tests on staging
        run: |
          npm ci
          npm test

      - name: Check if promotion is needed
        id: diff
        run: |
          AHEAD=$(gh api "repos/${{ github.repository }}/compare/main...staging" --jq '.ahead_by')
          echo "ahead_by=$AHEAD" >> "$GITHUB_OUTPUT"
          if [ "$AHEAD" -eq 0 ]; then
            echo "staging has no new commits for main. Nothing to promote."
          else
            echo "staging is $AHEAD commit(s) ahead of main."
          fi

      - name: Create or find promotion pull request
        if: steps.diff.outputs.ahead_by != '0'
        id: pr
        run: |
          EXISTING=$(gh pr list --base main --head staging --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Using existing PR #$EXISTING"
            echo "number=$EXISTING" >> "$GITHUB_OUTPUT"
          else
            gh pr create \
              --base main \
              --head staging \
              --title "Promote staging to production" \
              --body "Automated promotion from the Promote to Production workflow (run ${{ github.run_id }})."
            NUMBER=$(gh pr list --base main --head staging --state open --json number --jq '.[0].number')
            echo "Created PR #$NUMBER"
            echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge promotion pull request
        if: steps.diff.outputs.ahead_by != '0'
        run: gh pr merge "${{ steps.pr.outputs.number }}" --merge

      - name: Sync staging with main
        if: steps.diff.outputs.ahead_by != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main staging
          git checkout staging
          git merge origin/main --no-edit -m "Sync staging with main after promotion (run ${{ github.run_id }})"
          git push origin staging
